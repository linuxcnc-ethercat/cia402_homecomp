---
name: Build and simulation CI

on:  # yamllint disable-line rule:truthy
    push:
        branches: [main, feat/sim-homing]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    linuxcnc-matrix:
        name: LinuxCNC ${{ matrix.ref }}
        runs-on: ubuntu-22.04
        continue-on-error: ${{ matrix.ref == 'master' }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - ref: v2.9.10
                      cache: true
                      package: true
                    - ref: v2.10.0-pre2
                      cache: true
                      package: true
                    # Master is an early-warning canary.  Do not cache it:
                    # every run must build current upstream source.
                    - ref: master
                      cache: false
                      package: false

        steps:
            - name: Checkout homecomp
              uses: actions/checkout@v4

            - name: Restore versioned LinuxCNC build
              if: matrix.cache
              id: linuxcnc-cache
              uses: actions/cache@v4
              with:
                  path: linuxcnc
                  key: ${{ runner.os }}-linuxcnc-${{ matrix.ref }}-v1

            - name: Checkout LinuxCNC
              if: steps.linuxcnc-cache.outputs.cache-hit != 'true'
              uses: actions/checkout@v4
              with:
                  repository: linuxcnc/linuxcnc
                  ref: ${{ matrix.ref }}
                  path: linuxcnc
                  submodules: true

            - name: Checkout linuxcnc-ethercat cia402 source
              uses: actions/checkout@v4
              with:
                  repository: linuxcnc-ethercat/linuxcnc-ethercat
                  ref: 73fde32eda3d6e210c6e8a6c1d3e9fa423ba7ebc
                  path: linuxcnc-ethercat

            - name: Install LinuxCNC build dependencies
              run: |
                  set -e
                  cd linuxcnc
                  sudo ./scripts/travis-install-build-deps.sh
                  sudo apt-get install -y yapps2

            - name: Build LinuxCNC run-in-place
              if: steps.linuxcnc-cache.outputs.cache-hit != 'true'
              working-directory: linuxcnc/src
              run: |
                  set -e
                  ./autogen.sh
                  ./configure \
                      --with-realtime=uspace \
                      --disable-check-runtime-deps \
                      --disable-gtk \
                      --enable-non-distributable=yes
                  make -j2 default pycheck

            - name: Build components
              env:
                  LINUXCNC_SRC: ${{ github.workspace }}/linuxcnc
                  LINUXCNC_ETHERCAT_SRC: ${{ github.workspace }}/linuxcnc-ethercat
              run: scripts/build.sh

            - name: Run headless homing simulations
              env:
                  LINUXCNC_SRC: ${{ github.workspace }}/linuxcnc
              run: tests/sim/test.sh

            - name: Package test module
              if: matrix.package
              env:
                  LINUXCNC_SRC: ${{ github.workspace }}/linuxcnc
                  LINUXCNC_REF: ${{ matrix.ref }}
              run: scripts/package.sh

            - name: Upload test package
              if: matrix.package
              uses: actions/upload-artifact@v4
              with:
                  name: cia402-homecomp-${{ matrix.ref }}-amd64
                  path: dist/*.deb
                  if-no-files-found: error
                  retention-days: 90
