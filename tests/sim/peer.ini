[EMC]
VERSION = 1.1
MACHINE = cia402-base-peer-abort-sim
DEBUG = 0

[DISPLAY]
DISPLAY = ./peer-ui.py

[EMCMOT]
EMCMOT = motmod unlock_joints_mask=1
HOMEMOD = cia402_homecomp
COMM_TIMEOUT = 4.0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100

[HAL]
HALFILE = test.hal

[TRAJ]
NO_FORCE_HOMING = 1
COORDINATES = XY
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 10.0
MAX_LINEAR_VELOCITY = 100.0

[KINS]
KINEMATICS = trivkins
JOINTS = 2

[AXIS_X]
MIN_LIMIT = -200.0
MAX_LIMIT = 200.0
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 500.0

[AXIS_Y]
MIN_LIMIT = -200.0
MAX_LIMIT = 200.0
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 500.0

[JOINT_0]
TYPE = LINEAR
HOME = 25.0
HOME_OFFSET = 5.0
HOME_FINAL_VEL = 10.0
HOME_SEARCH_VEL = -10.0
HOME_LATCH_VEL = -2.0
HOME_SEQUENCE = 0
FERROR = 0.25
MIN_FERROR = 0.10
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 500.0
MIN_LIMIT = -200.0
MAX_LIMIT = 200.0

[JOINT_1]
TYPE = LINEAR
HOME = 20.0
HOME_OFFSET = -5.0
HOME_FINAL_VEL = 10.0
HOME_SEARCH_VEL = -10.0
HOME_LATCH_VEL = -2.0
HOME_LATCH_DIST = 1.0
HOME_IS_SHARED = 1
HOME_SEQUENCE = 0
FERROR = 0.25
MIN_FERROR = 0.10
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 500.0
MIN_LIMIT = -200.0
MAX_LIMIT = 200.0
